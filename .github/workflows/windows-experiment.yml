name: Windows layout experiment

on:
  push:
    branches: [claude/magical-mendel-37z1em]
    paths: ['windows/**', '.github/workflows/windows-experiment.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install MSKLC
        shell: pwsh
        timeout-minutes: 6
        run: choco install keyboard-layout-creator -y --no-progress --limit-output 2>&1 | Select-Object -Last 5

      - name: Generate KLC
        shell: pwsh
        run: python windows/make_klc.py work

      - name: kbdutool usage + build
        shell: pwsh
        timeout-minutes: 3
        continue-on-error: true
        run: |
          $root = "C:\Program Files (x86)\Microsoft Keyboard Layout Creator 1.4"
          $env:PATH = "$root\bin\i386;" + $env:PATH
          $env:INCLUDE = "$root\inc"
          Write-Host "--- usage ---"
          & kbdutool.exe 2>&1 | Select-Object -First 40
          Write-Host "--- /? ---"
          & kbdutool.exe /? 2>&1 | Select-Object -First 40
          Push-Location work
          Write-Host "--- build -u -s ---"
          & kbdutool.exe -v -w -u -s alifbo26.klc 2>&1 | Select-Object -First 80
          Write-Host "exit: $LASTEXITCODE"
          Get-ChildItem -Recurse | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200
          Pop-Location
