name: Windows layout experiment

on:
  push:
    branches: [claude/magical-mendel-37z1em]
    paths: ['windows/experiment/**', '.github/workflows/windows-experiment.yml']
  workflow_dispatch:

jobs:
  msklc:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install MSKLC (choco keyboard-layout-creator)
        shell: pwsh
        timeout-minutes: 6
        continue-on-error: true
        run: |
          choco install keyboard-layout-creator -y --no-progress --limit-output 2>&1 | Select-Object -Last 30

      - name: Inspect
        shell: pwsh
        continue-on-error: true
        run: |
          $root = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "Microsoft Keyboard Layout Creator*" | Select-Object -First 1
          Write-Host "ROOT: $($root.FullName)"
          Get-ChildItem $root.FullName -Recurse | Where-Object { -not $_.PSIsContainer } | Select-Object -First 80 @{n='p';e={$_.FullName.Replace($root.FullName,'')}}, Length | Format-Table -AutoSize | Out-String -Width 200

      - name: Run kbdutool on test layout
        shell: pwsh
        timeout-minutes: 3
        continue-on-error: true
        run: |
          $root = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "Microsoft Keyboard Layout Creator*" | Select-Object -First 1
          $kbdutool = Get-ChildItem $root.FullName -Recurse -Filter kbdutool.exe | Select-Object -First 1
          Write-Host "kbdutool: $($kbdutool.FullName)"
          New-Item -ItemType Directory -Force -Path work | Out-Null
          Copy-Item windows\experiment\test.klc work\testuz.klc
          # KLC UTF-16LE (BOM)
          $t = Get-Content work\testuz.klc -Raw -Encoding UTF8
          [IO.File]::WriteAllText("$PWD\work\testuz.klc", $t, [Text.Encoding]::Unicode)
          Push-Location work
          & $kbdutool.FullName -v -u -s testuz.klc 2>&1 | Select-Object -First 80
          Write-Host "exit: $LASTEXITCODE"
          Get-ChildItem -Recurse | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200
          Pop-Location
