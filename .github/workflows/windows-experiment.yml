name: Windows layout experiment

on:
  push:
    branches: [claude/magical-mendel-37z1em]
    paths: ['windows/experiment/**', '.github/workflows/windows-experiment.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: choco / winget search
        shell: pwsh
        continue-on-error: true
        run: |
          choco search msklc --limit-output
          choco search "keyboard layout creator" --limit-output
          winget --version
          winget search "Keyboard Layout Creator" --accept-source-agreements

      - name: Compiler and kbd.h
        shell: pwsh
        continue-on-error: true
        run: |
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Directory | Select-Object Name
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Recurse -Filter kbd.h -ErrorAction SilentlyContinue | Select-Object FullName
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Recurse -Filter ntddkbd.h -ErrorAction SilentlyContinue | Select-Object -First 3 FullName
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          Write-Host "VS: $vs"
          Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Select-Object Name
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Lib" -Directory | Select-Object Name
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10" -Directory | Select-Object Name
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Extensions" -ErrorAction SilentlyContinue | Select-Object Name

      - name: Try MSKLC via choco
        shell: pwsh
        timeout-minutes: 3
        continue-on-error: true
        run: |
          choco install msklc -y --no-progress 2>&1 | Select-Object -Last 25
          Get-ChildItem "C:\Program Files (x86)\Microsoft Keyboard Layout Creator 1.4" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 40 FullName
