name: Windows layout experiment

on:
  push:
    branches: [claude/magical-mendel-37z1em]
    paths: ['windows/**', '.github/workflows/windows-experiment.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install MSKLC
        shell: pwsh
        timeout-minutes: 6
        run: choco install keyboard-layout-creator -y --no-progress --limit-output 2>&1 | Select-Object -Last 3

      - name: Generate KLC and build DLLs
        shell: pwsh
        timeout-minutes: 5
        continue-on-error: true
        run: |
          python windows/make_klc.py work
          $root = "C:\Program Files (x86)\Microsoft Keyboard Layout Creator 1.4"
          $env:PATH = "$root\bin\i386;" + $env:PATH
          Push-Location work
          foreach ($arch in '-x','-m','-o') {
            Write-Host "=== $arch ==="
            & kbdutool.exe -u $arch alifbo26.klc 2>&1 | Select-Object -First 30
            Write-Host "exit: $LASTEXITCODE"
          }
          Get-ChildItem -Recurse | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 220
          Pop-Location
