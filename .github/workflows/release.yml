name: Release

# Yangi versiya chiqarish (Android APK + Windows klaviatura oʻrnatuvchisi bir relizda):
#   1) git tag v1.3.0 && git push origin v1.3.0
#   yoki  2) Actions → "Release" → Run workflow → version: 1.3.0
# Natija: GitHub Releases'da  Alifbo-v1.3.0.apk  va  Alifbo-Windows-Setup-v1.3.0.exe

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versiya (masalan 1.3.0)'
        required: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Versiyani aniqlash
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          V="${V#v}"
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Versiya X.Y.Z koʻrinishida boʻlishi kerak (hozir: '$V')"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Imzo kaliti borligini tekshirish
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret yoʻq. Repo → Settings → Secrets and variables → Actions ga ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD ni qoʻshing."
            exit 1
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/alifbo.jks"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Validate alphabet packs
        run: python3 tools/build_registry.py

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/alifbo.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon \
            -PversionName=${{ needs.version.outputs.version }} \
            -PgithubRepo=${{ github.repository }} -PregistryUrl=https://raw.githubusercontent.com/${{ github.repository }}/main/registry/registry.json
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/Alifbo-v${{ needs.version.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: alifbo-android
          path: dist/*.apk

  windows:
    needs: version
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, android, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Fayllar
        run: ls -la dist

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Alifbo v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
          body: |
            ## Android
            1. **Alifbo-v${{ needs.version.outputs.version }}.apk** ni telefonga yuklab oling va oching.
            2. «Notanish manbalardan oʻrnatish» ruxsatini bering (Samsung'da Auto Blocker yoqiq boʻlsa, oʻchiring).
            3. Ilovani oching → «Klaviaturani yoqish» → «Klaviaturani tanlash».

            Yangi versiya eskisining ustiga oʻrnatiladi, sozlamalar saqlanadi (ilova ichidan ham yangilash mumkin).

            ## Windows 10 / 11
            1. **Alifbo-Windows-Setup-v${{ needs.version.outputs.version }}.exe** ni yuklab, ishga tushiring (administrator ruxsati kerak).
            2. `Win + Boʻsh joy` bilan «Uzbek (Latin 2026) - Alifbo» ni tanlang.

            Windows sxemasi tizim darajasida ishlaydi (fonda hech qanday dastur ishlamaydi). Batafsil: [windows/README.md](https://github.com/${{ github.repository }}/blob/main/windows/README.md)
