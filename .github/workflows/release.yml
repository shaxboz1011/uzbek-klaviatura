name: Release APK

# Yangi versiya chiqarish:
#   1) git tag v1.2.0 && git push origin v1.2.0
#   yoki  2) Actions → "Release APK" → Run workflow → version: 1.2.0
# Natija: GitHub Releases'da  Alifbo-v1.2.0.apk

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versiya (masalan 1.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Versiyani aniqlash
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          V="${V#v}"
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Versiya X.Y.Z koʻrinishida boʻlishi kerak (hozir: '$V')"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Imzo kaliti borligini tekshirish
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret yoʻq. Repo → Settings → Secrets and variables → Actions ga ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD ni qoʻshing."
            exit 1
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/alifbo.jks"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Validate alphabet packs
        run: python3 tools/build_registry.py

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/alifbo.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon \
            -PversionName=${{ steps.v.outputs.version }} \
            -PgithubRepo=${{ github.repository }} -PregistryUrl=https://raw.githubusercontent.com/${{ github.repository }}/main/registry/registry.json
          cp app/build/outputs/apk/release/*.apk "Alifbo-v${{ steps.v.outputs.version }}.apk"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Alifbo v${{ steps.v.outputs.version }}
          generate_release_notes: true
          files: Alifbo-v${{ steps.v.outputs.version }}.apk
          body: |
            ## Oʻrnatish
            1. Pastdagi **Alifbo-v${{ steps.v.outputs.version }}.apk** ni telefonga yuklab oling va oching.
            2. «Noma'lum manbalardan oʻrnatish» ruxsatini bering (Samsung'da Auto Blocker yoqiq boʻlsa, uni oʻchiring).
            3. Ilovani oching → «Klaviaturani yoqish» → «Klaviaturani tanlash».

            Yangi versiya eskisining ustiga oʻrnatiladi, sozlamalar saqlanadi.
