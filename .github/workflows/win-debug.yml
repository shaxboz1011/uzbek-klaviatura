name: Windows debug

on:
  push:
    branches: [claude/magical-mendel-37z1em]
    paths: ['windows/debug/**', '.github/workflows/win-debug.yml']

jobs:
  dbg:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install MSKLC
        shell: pwsh
        run: choco install keyboard-layout-creator -y --no-progress --limit-output 2>&1 | Select-Object -Last 2
      - name: Show generated C
        shell: pwsh
        run: |
          python windows/make_klc.py work
          $root = "C:\Program Files (x86)\Microsoft Keyboard Layout Creator 1.4"
          $env:PATH = "$root\bin\i386;" + $env:PATH
          Push-Location work
          & kbdutool.exe -u -s alifbo26.klc | Out-Null
          Write-Host "---- C (VK_W / OEM_6 / OEM_7 rows) ----"
          Select-String -Path alifbo26.C -Pattern 'T11|T1B|T28|T1A|VK_W|VK_OEM_6|VK_OEM_7|WCH_|0x15f|015f' -SimpleMatch:$false | Select-Object -First 40 | ForEach-Object { $_.Line }
          Write-Host "---- C head 60 ----"
          Get-Content alifbo26.C -TotalCount 60
          Write-Host "---- HEX of file around 'ş' in klc ----"
          $b = [IO.File]::ReadAllBytes("$PWD\alifbo26.klc")
          ($b[0..60] | ForEach-Object { '{0:X2}' -f $_ }) -join ' '
          Pop-Location
