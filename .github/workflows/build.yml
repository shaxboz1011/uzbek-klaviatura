name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Android SDK runner'da tayyor; faqat litsenziyalarni qabul qilamiz
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Validate alphabet packs
        run: python3 tools/build_registry.py

      - name: Build debug APK
        run: >
          gradle :app:assembleDebug --no-daemon
          -PregistryUrl=https://raw.githubusercontent.com/${{ github.repository }}/main/registry/registry.json

      - uses: actions/upload-artifact@v4
        with:
          name: alifbo-klaviatura-debug
          path: app/build/outputs/apk/debug/*.apk
