name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Qatʼiy imzo kaliti boʻlsa (Secrets), debug APK ham reliz bilan bir xil imzolanadi — ustiga oʻrnatish ishlaydi.
      - name: Imzo kaliti (ixtiyoriy)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          K_ALIAS: ${{ secrets.KEY_ALIAS }}
          K_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/alifbo.jks"
            {
              echo "KEYSTORE_FILE=$RUNNER_TEMP/alifbo.jks"
              echo "KEYSTORE_PASSWORD=$KS_PASS"
              echo "KEY_ALIAS=$K_ALIAS"
              echo "KEY_PASSWORD=$K_PASS"
            } >> "$GITHUB_ENV"
          fi

      - name: Validate alphabet packs
        run: python3 tools/build_registry.py

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon -PregistryUrl=https://raw.githubusercontent.com/${{ github.repository }}/main/registry/registry.json 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        run: |
          {
            echo '### Kompilyator xatolari'
            echo '```'
            grep -E '^e: ' build.log | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/##' || echo '(e: qatorlari topilmadi)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: alifbo-klaviatura-debug
          path: app/build/outputs/apk/debug/*.apk
