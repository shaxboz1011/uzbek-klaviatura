name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # ci-screenshots branchiga rasmlarni yuklash uchun
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Qatʼiy imzo kaliti boʻlsa (Secrets), debug APK ham reliz bilan bir xil imzolanadi — ustiga oʻrnatish ishlaydi.
      - name: Imzo kaliti (ixtiyoriy)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          K_ALIAS: ${{ secrets.KEY_ALIAS }}
          K_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/alifbo.jks"
            {
              echo "KEYSTORE_FILE=$RUNNER_TEMP/alifbo.jks"
              echo "KEYSTORE_PASSWORD=$KS_PASS"
              echo "KEY_ALIAS=$K_ALIAS"
              echo "KEY_PASSWORD=$K_PASS"
            } >> "$GITHUB_ENV"
          fi

      - name: Check Uzbek lexicon
        run: |
          python3 tools/make_uz_lexicon.py
          git diff --exit-code registry/dict/ || (echo "::error::registry/dict/ yangilanmagan: python3 tools/make_uz_lexicon.py ni ishga tushirib commit qiling" && exit 1)
          python3 tools/test_uz_lexicon.py

      - name: Validate alphabet packs
        run: python3 tools/build_registry.py

      - name: Unit tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --no-daemon 2>&1 | tee unit.log

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon -PgithubRepo=${{ github.repository }} -PregistryUrl=https://raw.githubusercontent.com/${{ github.repository }}/main/registry/registry.json 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        run: |
          {
            echo '### Kompilyator xatolari'
            echo '```'
            grep -E '^e: ' build.log | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/##' || echo '(e: qatorlari topilmadi)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keyboard screenshots (rendered by unit tests)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keyboard-screenshots
          path: app/build/screenshots/*.png
          if-no-files-found: ignore

      # Rasmlarni ko'rish oson bo'lishi uchun alohida branch (har safar qayta yoziladi; main ga aralashmaydi)
      - name: Publish screenshots to ci-screenshots branch
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          if ls app/build/screenshots/*.png >/dev/null 2>&1; then
            d=$(mktemp -d)
            cp app/build/screenshots/*.png "$d"/
            cd "$d"
            git init -q
            git checkout -q -b ci-screenshots
            git add .
            git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "screenshots for $GITHUB_SHA"
            git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: alifbo-klaviatura-debug
          path: app/build/outputs/apk/debug/*.apk
